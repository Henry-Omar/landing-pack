# Render.com deploy config for Landing Pack · 留学生落地包
# One-command: connect the repo, Render builds this Dockerfile and serves it.
services:
  - type: web
    name: landing-pack
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: APP_BASE_URL
        sync: false          # set this to your live URL after first deploy
      - key: PAYMENT_PROVIDER
        value: mock          # set to "stripe" + add keys once you go live with payments
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
    # Persist the SQLite DB across deploys/restarts:
    # Render: attach a disk at mountPath /app/landing.db  (or back it up externally)
